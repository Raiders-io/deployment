# default configuration example for a Prometheus server.
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "prometheus"

  - job_name: "Nginx"
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-prometheus-exporter:9113']

  - job_name: 'garage'
    static_configs:
      - targets:
        - 'garage:3903'
    authorization:
      type: Bearer
      credentials: "${GARAGE_METRICS_TOKEN}"

  - job_name: "messaging-api"
    metrics_path: /private/messaging/metrics
    static_configs:
      - targets: ['messaging-api:3334']

  - job_name: "object-api"
    metrics_path: /private/object/metrics
    static_configs:
      - targets: ['object-api:3333']

  - job_name: "lesson-api"
    metrics_path: /private/lesson/metrics
    static_configs:
      - targets: ['lesson-api:3333']

  - job_name: "user-api"
    metrics_path: /private/user/metrics
    static_configs:
      - targets: ['user-api:3333']

  - job_name: "exam-api"
    metrics_path: /private/exam/metrics
    static_configs:
      - targets: ['exam-api:3333']
