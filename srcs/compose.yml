services:
### Web Server: interface for users to interact with the application
  nginx:
    container_name: nginx
    image: nginx:1.31.1-alpine-slim
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-html:/var/www/html:ro
      - nginx-certs:/etc/ssl/certs:ro
      - nginx-private:/etc/ssl/private:ro
    networks:
      - public-network
      - gateway-network
      - monitoring-network
    ports:
      - "4443:443"
    depends_on:
      api-gateway:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: always

  api-gateway:
    build: 
      context: ./api-gateway
      target: production # production or dev
    container_name: api-gateway
    image: api-gateway:local
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:?}
      - MESSAGING_SERVICE_URL=${MESSAGING_SERVICE_URL:?}
      - USER_SERVICE_URL=${USER_SERVICE_URL:?}
    ports:
      - "3000:3000"
    networks:
      - api-network
      - gateway-network
    restart: always

  frontend-builder:
    container_name: frontend-builder
    build:
      context: ./Frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:?}
    image: frontend-builder:local
    volumes:
      - frontend-builder-dir:/app/:rw
      - nginx-html:/app/dist:rw
    restart: no
  
  redis:
    image: redis:8.10.0-alpine3.23
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - api-network
    restart: always

## DevOps
# Visualization tool for monitoring and analytics
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.0.1
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:?}
      GF_SERVER_HTTP_PORT: ${GF_SERVER_HTTP_PORT:?}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_ADMIN_USER: ${GF_ADMIN_USER:?}
      GF_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?}
    ports:
      - '${GRAFANA_PORT:?}:${GF_SERVER_HTTP_PORT:?}'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/config.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-network
    restart: unless-stopped

# Data collection for monitoring system
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.11.2-distroless
    container_name: prometheus
    command:
      - '--web.listen-address=:9090'
      - '--config.file=/prometheus.yml'
    ports:
      - '${PROMETHEUS_PORT:?}:9090'
    volumes:
      - prometheus-storage:/etc/prometheus/
      - ./prometheus.config.yml:/prometheus.yml
    networks:
      - monitoring-network
    restart: unless-stopped

# Data collection for monitoring system
  nginx-prometheus-exporter:
    profiles: [monitoring]
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-prometheus-exporter
    command:
      - '--nginx.scrape-uri=https://nginx/nginx_status'
      - '--web.listen-address=:9113'
      - '--no-nginx.ssl-verify'
    ports:
      - '9113:9113'
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
    internal: true
  public-network:
    driver: bridge
    external: true
  api-network:
    driver: bridge
    external: true
  monitoring-network:
    driver: bridge
    internal: true

volumes:
  nginx-html:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./nginx/html
  nginx-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./nginx/certs
  nginx-private:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./nginx/private
  frontend-builder-dir:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./Frontend/
  prometheus-storage:
  grafana-storage:
  esdata:
