
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl default_server;

    server_name here-username.here-domain.here-country-code;
    server_name www.here-username.here-domain.here-country-code;

	ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
	ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

	# Applies the limit
	limit_req zone=lim burst=50 nodelay;

	# Reduce the verbosity (version) of nginx server header
	server_tokens off;

	root /var/www/html;
	index index.html index.htm;

	absolute_redirect off;

	# Block access to all hidden files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	location /api/ {

		proxy_pass http://api-gateway:3000/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS' always;
		add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

		location /api/v1/storage/ {
			proxy_pass http://api-gateway:3000/api/v1/storage/;
			client_max_body_size 10M;
		}

		location /api/socket.io/ {
			proxy_pass http://api-gateway:3000/api/socket.io/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 86400;
			proxy_send_timeout 86400;
			proxy_buffering off;
		}
	}

#__MONITORING_TOOLS__
#__END_MONITORING_TOOLS__

	location / {
		try_files $uri $uri/ /index.html;

		# Cache control headers for static files
		expires 30d;  # Cache navigateur pour 30 jours
		add_header Cache-Control "public, immutable";

		open_file_cache max=1000 inactive=20s; # 1000 fichiers, purge après 20s d'inactivité
		open_file_cache_valid 30s;             # Valide les métadonnées pendant 30s
		open_file_cache_min_uses 1;            # Cache après 1 accès (directement)
		open_file_cache_errors on;             # Cache aussi les erreurs (404, etc.)

		# Compression gzip for text-based files to reduce bandwidth usage and improve load times.
		gzip on;
		gzip_types text/plain text/css application/javascript application/json;
		gzip_min_length 1000;
		gzip_proxied any;
	}
}
